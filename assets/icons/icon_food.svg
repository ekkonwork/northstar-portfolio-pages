<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="foodGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F59E0B" />
      <stop offset="60%" stop-color="#E11D48" />
      <stop offset="100%" stop-color="#FFA07A" />
    </linearGradient>
    <radialGradient id="liquidAura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#E11D48" stop-opacity="0" />
    </radialGradient>
  </defs>
  <style>
    .cloche { stroke: url(#foodGrad); stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    .steam1 { stroke: #F59E0B; stroke-width: 2; stroke-linecap: round; opacity: 0; animation: steamFloat 2.6s ease-in-out infinite; }
    .steam2 { stroke: #FFA07A; stroke-width: 1.8; stroke-linecap: round; opacity: 0; animation: steamFloat 2.6s ease-in-out infinite 0.9s; }
    .steam3 { stroke: #E11D48; stroke-width: 1.8; stroke-linecap: round; opacity: 0; animation: steamFloat 2.6s ease-in-out infinite 1.7s; }
    .splash-drop { fill: #F59E0B; animation: dropBounce 3s ease-in-out infinite; }
    @keyframes steamFloat {
      0% { transform: translateY(5px); opacity: 0; }
      50% { opacity: 0.85; }
      100% { transform: translateY(-12px); opacity: 0; }
    }
    @keyframes dropBounce {
      0%, 100% { transform: translateY(0) scale(1); }
      50% { transform: translateY(-4px) scale(1.15); }
    }
  </style>
  <circle cx="50" cy="50" r="40" fill="url(#liquidAura)" />
  
  <!-- Steam Trails -->
  <path class="steam1" d="M42 22 Q40 16 43 11 Q46 6 43 2" />
  <path class="steam2" d="M50 20 Q53 14 50 9 Q47 4 50 1" />
  <path class="steam3" d="M58 22 Q56 16 59 11 Q62 6 59 2" />

  <!-- Cloche Handle -->
  <circle cx="50" cy="27" r="4.5" stroke="url(#foodGrad)" stroke-width="2.5" fill="#120D0A" />

  <!-- Cloche Dome -->
  <path class="cloche" d="M22 66 C22 41, 34 31, 50 31 C66 31, 78 41, 78 66 Z" />
  
  <!-- Platter Base -->
  <line x1="16" y1="72" x2="84" y2="72" stroke="url(#foodGrad)" stroke-width="3" stroke-linecap="round" />
  <path d="M22 66 L78 66" stroke="#FFA07A" stroke-width="1.5" stroke-linecap="round" />
  
  <!-- Liquid Splashes / Floating droplets -->
  <circle class="splash-drop" cx="24" cy="42" r="2.5" />
  <circle class="splash-drop" cx="77" cy="38" r="3" />
  <circle class="splash-drop" cx="72" cy="54" r="1.8" />
  <circle class="splash-drop" cx="20" cy="56" r="1.5" />
</svg>
