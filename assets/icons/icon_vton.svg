<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="vtonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C2A68D" />
      <stop offset="100%" stop-color="#E8D8C8" />
    </linearGradient>
    <filter id="vtonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <style>
    .hanger { stroke: url(#vtonGrad); stroke-width: 2.5; stroke-linecap: round; stroke-linejoin: round; }
    .cloth { stroke: #F7F5F0; stroke-width: 2; fill: rgba(194, 166, 141, 0.12); stroke-dasharray: 200; stroke-dashoffset: 0; animation: clothBreathe 4s ease-in-out infinite alternate; }
    .scan-line { stroke: #C2A68D; stroke-width: 1.5; opacity: 0.8; animation: vtonScan 3s ease-in-out infinite; }
    @keyframes clothBreathe {
      0% { transform: scale(1); transform-origin: 50% 30%; }
      100% { transform: scale(1.03); transform-origin: 50% 30%; }
    }
    @keyframes vtonScan {
      0% { transform: translateY(25px); opacity: 0; }
      20% { opacity: 0.9; }
      80% { opacity: 0.9; }
      100% { transform: translateY(75px); opacity: 0; }
    }
  </style>
  <!-- Hanger Hook & Top -->
  <path class="hanger" d="M50 20 C50 14, 56 12, 56 17 C56 22, 50 23, 50 28" />
  <path class="hanger" d="M50 28 L25 40 C23 41, 23 44, 26 44 L74 44 C77 44, 77 41, 75 40 Z" />
  
  <!-- Blazer / Garment Silhouette -->
  <path class="cloth" d="M30 44 L20 62 C19 64, 21 66, 24 66 L29 57 L29 84 C29 86, 31 88, 33 88 L67 88 C69 88, 71 86, 71 84 L71 57 L76 66 C79 66, 81 64, 80 62 L70 44 Z" />
  <!-- Lapel detail -->
  <path d="M42 44 L50 64 L58 44" stroke="#C2A68D" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" />
  <line x1="50" y1="64" x2="50" y2="88" stroke="#C2A68D" stroke-width="1.5" stroke-dasharray="2 3" />
  
  <!-- Fitting Scanning Grid Indicator -->
  <line class="scan-line" x1="16" y1="0" x2="84" y2="0" filter="url(#vtonGlow)" />
  <circle cx="50" cy="72" r="1.5" fill="#C2A68D" />
  <circle cx="50" cy="78" r="1.5" fill="#C2A68D" />
</svg>
